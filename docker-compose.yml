version: "3.9"

services:
  eco-ai-db:
    image: postgres:15.18-trixie
    container_name: eco-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eco-network

  eco-ai-backend:
    image : mldoc101/dev-prod:backend-v1.0
    container_name: eco-ai-backend
    restart: unless-stopped
    depends_on:
      - eco-ai-db
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@eco-ai-db:5432/postgres
      SMARTECO_API_URL: ${SMARTECO_API_URL:-http://host.docker.internal:3002/api/v1}
      SORTING_FRONTEND_ORIGINS: ${SORTING_FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SORTING_COOKIE_SECURE: ${SORTING_COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace/
    networks:
      - eco-network

  eco-ai-frontend:
    image: smarteco-sorting-frontend:local
    build: ./frontend
    container_name: eco-ai-frontend
    restart: unless-stopped
    depends_on:
      - eco-ai-backend
    ports:
      - "3000:80"
    networks:
      - eco-network

volumes:
  postgres_data:

networks:
  eco-network:
    driver: bridge
